        let globalRomaji = false;

        function toggleGlobalRomaji() {
            globalRomaji = !globalRomaji;
            if (globalRomaji) {
                document.body.classList.add('show-romaji');
                document.getElementById('romaji-toggle-btn').innerHTML = "👁️‍🗨️ Romaji <ruby>表<rt>ひょう</rt></ruby><ruby>示<rt>じ</rt></ruby> (Visível)";
            } else {
                document.body.classList.remove('show-romaji');
                document.getElementById('romaji-toggle-btn').innerHTML = "👁️ Romaji <ruby>隠<rt>かく</rt></ruby>す (Oculto)";
            }
        }

        function initApp() {
            renderNav();
            renderSections();
            switchTab('vocab');
        }

        function renderNav() {
            const nav = document.getElementById('main-nav');
            const sections = [
                { id: 'vocab', label: "<ruby>語<rt>ご</rt></ruby><ruby>彙<rt>い</rt></ruby>" },
                { id: 'bunkei', label: "<ruby>文<rt>ぶん</rt></ruby><ruby>型<rt>けい</rt></ruby>・<ruby>例<rt>れい</rt></ruby><ruby>文<rt>ぶん</rt></ruby>" },
                { id: 'gramatica', label: "<ruby>文<rt>ぶん</rt></ruby><ruby>法<rt>ぽう</rt></ruby>" },
                { id: 'renshuuB', label: "<ruby>練<rt>れん</rt></ruby><ruby>習<rt>しゅう</rt></ruby>B" },
                { id: 'renshuuC', label: "<ruby>練<rt>れん</rt></ruby><ruby>習<rt>しゅう</rt></ruby>C" },
                { id: 'mondai', label: "<ruby>問<rt>もん</rt></ruby><ruby>題<rt>だい</rt></ruby>" }
            ];

            nav.innerHTML = sections.map(sec => `
                <button class="tab-btn" id="btn-${sec.id}" onclick="switchTab('${sec.id}')">
                    ${sec.label}
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section-container').forEach(sec => sec.classList.remove('active'));
            
            document.getElementById(`btn-${tabId}`).classList.add('active');
            document.getElementById(`sec-${tabId}`).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderSections() {
            const container = document.getElementById('main-container');
            
            // Vocab
            let html = `<div id="sec-vocab" class="section-container card">
                <h2 class="card-header">${lessonData.vocab.title}</h2>
                <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px;">
                    ${lessonData.vocab.items.map(v => `
                        <div class="exercise-item">
                            <div style="font-size: 1.2rem; font-weight: bold;">${v.jp}</div>
                            <div class="romaji">${v.romaji}</div>
                            <div style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">🇧🇷 ${v.pt}</div>
                        </div>
                    `).join('')}
                </div>
            </div>`;

            // Bunkei & Reibun
            html += `<div id="sec-bunkei" class="section-container">
                <div class="card">
                    <h2 class="card-header">${lessonData.bunkei.title}</h2>
                    ${lessonData.bunkei.items.map(b => `
                        <div class="exercise-item">
                            <div style="font-size: 1.2rem; font-weight: bold; color: var(--primary);">${b.jp}</div>
                            <div class="romaji">${b.romaji}</div>
                            <div style="color: var(--text-muted); font-size: 0.95rem; margin-top: 5px;">🇧🇷 ${b.pt}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="card">
                    <h2 class="card-header">${lessonData.reibun.title}</h2>
                    ${lessonData.reibun.items.map(r => `
                        <div class="exercise-item">
                            <div style="font-size: 1.1rem; font-weight: bold;">${r.jp}</div>
                            <div class="romaji">${r.romaji}</div>
                            <div style="color: var(--text-muted); font-size: 0.95rem; margin-top: 5px;">🇧🇷 ${r.pt}</div>
                        </div>
                    `).join('')}
                </div>
            </div>`;

            // Gramatica
            html += `<div id="sec-gramatica" class="section-container">
                ${lessonData.gramatica.content}
            </div>`;

            const generateExerciseBlock = (dataObj, secId) => {
                let blockHtml = `<div id="sec-${secId}" class="section-container">
                    <div class="card">
                        <h2 class="card-header">${dataObj.title}</h2>`;
                
                dataObj.exercises.forEach((exGroup, groupIdx) => {
                    blockHtml += `<h3 style="margin: 20px 0 10px 0; color: var(--primary);">${exGroup.desc}</h3>`;
                    
                    exGroup.questions.forEach((q, qIdx) => {
                        const uniqueId = `${secId}-${groupIdx}-${qIdx}`;
                        const isDialogue = q.q.includes('<br>'); // Detect if it's a conversation
                        blockHtml += `
                            <div class="exercise-item">
                                <div class="exercise-prompt">${q.q}</div>
                                <div class="exercise-controls">
                                    <input type="text" id="input-${uniqueId}" class="input-text" placeholder="<ruby>答<rt>こた</rt></ruby>えを<ruby>入力<rt>にゅうりょく</rt></ruby>...">
                                    <button class="btn btn-check" onclick="checkAnswer('input-${uniqueId}', '${q.a}', 'feedback-${uniqueId}')">
                                        ✅ Verificar (<ruby>確<rt>かく</rt></ruby><ruby>認<rt>にん</rt></ruby>)
                                    </button>
                                    <button class="btn btn-reveal" onclick="toggleAnswer('ans-${uniqueId}')">
                                        💡 Revelar (<ruby>答<rt>こた</rt></ruby>え)
                                    </button>
                                </div>
                                <div id="feedback-${uniqueId}" class="feedback-box"></div>
                                <div id="ans-${uniqueId}" class="answer-box">
                                    <div><ruby>正<rt>せい</rt></ruby><ruby>解<rt>かい</rt></ruby>: ${q.a}</div>
                                    <div class="romaji">${q.romaji}</div>
                                    <div style="color: #475569; font-weight: normal; margin-top: 5px; font-size: 0.9rem;">Tradução: ${q.pt}</div>
                                </div>
                            </div>
                        `;
                    });
                });
                
                blockHtml += `</div></div>`;
                return blockHtml;
            };

            html += generateExerciseBlock(lessonData.renshuuB, 'renshuuB');
            html += generateExerciseBlock(lessonData.renshuuC, 'renshuuC');
            html += generateExerciseBlock(lessonData.mondai, 'mondai');

            container.innerHTML = html;
        }

        function checkAnswer(inputId, correctHtmlStr, feedbackId) {
            const inputEl = document.getElementById(inputId);
            const feedbackEl = document.getElementById(feedbackId);
            const userVal = inputEl.value.trim().replace(/\s+/g, '');
            
            // Extract pure text from the correct HTML string (remove ruby tags for checking)
            // Example: "<ruby>書<rt>か</rt></ruby>かない" -> "書かない"
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = correctHtmlStr;
            
            // Remove rt elements completely to just get the Kanji/Kana base
            const rtElements = tempDiv.querySelectorAll('rt');
            rtElements.forEach(rt => rt.remove());
            const correctPureText = tempDiv.textContent.replace(/\s+/g, '');

            if (!userVal) {
                feedbackEl.innerHTML = "⚠️ <ruby>入<rt>にゅう</rt></ruby><ruby>力<rt>りょく</rt></ruby>してください。(Por favor, digite a resposta)";
                feedbackEl.className = "feedback-box feedback-incorrect";
                return;
            }

            // Simple exact match check (Note: For real world, might need to allow kana vs kanji variation, but keeping it strict to expected form for this drill).
            if (userVal === correctPureText) {
                feedbackEl.innerHTML = "⭕ <ruby>正<rt>せい</rt></ruby><ruby>解<rt>かい</rt></ruby>です！ (Correto!)";
                feedbackEl.className = "feedback-box feedback-correct";
            } else {
                feedbackEl.innerHTML = `❌ <ruby>不<rt>ふ</rt></ruby><ruby>正<rt>せい</rt></ruby><ruby>解<rt>かい</rt></ruby>です。(Incorreto). Você digitou: ${userVal}`;
                feedbackEl.className = "feedback-box feedback-incorrect";
            }
        }

        function toggleAnswer(ansId) {
            const ansEl = document.getElementById(ansId);
            ansEl.classList.toggle('visible');
        }

        // Boot
        window.onload = initApp;

    </script>
