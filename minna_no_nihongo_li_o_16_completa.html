                    <div class="text-sm font-bold text-slate-800">${promptText}</div>
                    <div class="text-xs text-slate-400">Romaji gabarito: <span class="romaji">${answerRomaji}</span></div>

                        <input type="text" id="input-${id}" placeholder="Digite a resposta em japonês..." class="border border-slate-300 px-3.5 py-2 rounded-xl text-sm w-full sm:w-96 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                        <div class="flex gap-2">
                            <button onclick="checkAnswer('input-${id}', '${answerOfficial}', 'feedback-${id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm transition-all shadow">Verificar</button>
                            <button onclick="toggleAnswerBox('answer-box-${id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-3.5 py-2 rounded-xl text-xs sm:text-sm transition-all shadow">Gabarito</button>
                        </div>
                    </div>
                    <div id="feedback-${id}" class="text-xs font-bold"></div>
                    <div id="answer-box-${id}" class="hidden p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-900 font-bold text-sm animate-fade">
                        正解: ${answerOfficial}
                    </div>
                </div>
            `;
        }

        function checkAnswer(inputId, correctStr, feedbackId) {
            const userVal = document.getElementById(inputId).value.trim();
            const feedback = document.getElementById(feedbackId);

            if (!userVal) {
                feedback.className = "text-xs font-bold text-amber-600 bg-amber-50 p-2 rounded-lg border border-amber-200 animate-fade";
                feedback.innerHTML = "⚠️ Por favor, digite uma resposta antes de verificar.";
                return;
            }

            // Normalization for comparison
            const normUser = userVal.replace(/\s+/g, '').replace(/[\u3040-\u309F]/g, c => String.fromCharCode(c.charCodeAt(0)));
            const options = correctStr.split('／').map(s => s.replace(/\s+/g, ''));

            const isCorrect = options.some(opt => normUser === opt);

            if (isCorrect) {
                feedback.className = "text-xs font-bold text-emerald-600 bg-emerald-50 p-2 rounded-lg border border-emerald-200 animate-fade";
                feedback.innerHTML = "✓ 正解です！ (Resposta Correta!)";
            } else {
                feedback.className = "text-xs font-bold text-rose-600 bg-rose-50 p-2 rounded-lg border border-rose-200 animate-fade";
                feedback.innerHTML = `✕ 不正解 (Incorreto). Gabarito: ${correctStr}`;
            }
        }

        function toggleAnswerBox(boxId) {
            const box = document.getElementById(boxId);
            if (box.classList.contains('hidden')) {
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        // Initialize application on page load

        };
