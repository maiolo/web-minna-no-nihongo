<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%230f766e%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2770%27 text-anchor=%27middle%27 fill=%27white%27%3E日%3C/text%3E%3C/svg%3E">
    <title>みんなの日本語 - Índice das Lições</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="hero">
        <div class="header-content">
            <div class="header-title">
                <h1>みんなの<ruby>日<rt>に</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>語<rt>ご</rt></ruby></h1>
                <p>Índice das lições • Vocabulário, gramática e exercícios interativos</p>
            </div>
        </div>
    </header>

    <main>
        <h2 class="section-title" style="margin-top: 30px;"><ruby>課<rt>か</rt></ruby> (Lições disponíveis)</h2>
        <ul class="lesson-grid" id="lesson-list"></ul>
    </main>

    <footer>
        みんなの日本語 • versão web para estudo
    </footer>

    <script src="assets/js/lessons-index.js"></script>
    <script>
        (function () {
            var list = document.getElementById("lesson-list");
            if (!window.LESSONS || !window.LESSONS.length) {
                list.outerHTML = '<p class="empty-state">Nenhuma lição disponível ainda.</p>';
                return;
            }
            list.innerHTML = window.LESSONS.map(function (l) {
                return '<li><a class="lesson-card" href="lessons/' + l.file + '">' +
                    '<div class="lesson-number">' + window.lessonLabel(l.number) + "</div>" +
                    '<div class="lesson-topic">' + l.topic + "</div>" +
                    '<p class="lesson-desc">' + l.description + "</p>" +
                    '<span class="lesson-go">Abrir lição →</span>' +
                "</a></li>";
            }).join("");
        })();
    </script>
</body>
</html>
