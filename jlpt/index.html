<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23B0281F%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2770%27 text-anchor=%27middle%27 fill=%27white%27%3E日%3C/text%3E%3C/svg%3E">
    <title>JLPT - 日本語能力試験</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F5F0E6">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/prefs.js"></script>
    <script src="../assets/js/i18n.js"></script>
    <script src="../assets/js/i18n-strings.js"></script>
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <script src="../assets/js/pwa.js" defer></script>
</head>
<body>

    <header id="page-header"></header>

    <main>
        <p class="page-intro"><ruby>日<rt>に</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>語<rt>ご</rt></ruby><ruby>能<rt>のう</rt></ruby><ruby>力<rt>りょく</rt></ruby><ruby>試<rt>し</rt></ruby><ruby>験<rt>けん</rt></ruby> • <span data-i18n="jlpt.intro">Material de apoio para o Exame de Proficiência em Língua Japonesa.</span></p>
        <div id="jlpt-sections"></div>
    </main>

    <footer>
        <span data-i18n="home.footer">みんなの日本語 • versão web para estudo</span>
    </footer>

    <script src="../assets/js/settings-panel.js"></script>
    <script src="../assets/js/site-header.js"></script>
    <script>
        SiteHeader.render(document.getElementById("page-header"), {
            stamp: "試",
            title: "JLPT",
            back: { href: "../index.html", label: I18n.t("jlpt.backHome") },
            crumbs: [{ label: I18n.t("lesson.home"), href: "../index.html" }, { label: "JLPT" }]
        });
    </script>
    <script src="../assets/js/jlpt-index.js"></script>
    <script>
        (function () {
            var host = document.getElementById("jlpt-sections");
            var pages = window.JLPT_PAGES || [], groups = window.JLPT_GROUPS || [];
            if (!pages.length) {
                host.innerHTML = '<p class="empty-state">' + I18n.t("jlpt.none") + '</p>';
                return;
            }
            function card(p) {
                var inner = '<div class="lesson-number">' + p.level + "</div>" +
                    '<div class="lesson-topic">' + p.topic + "</div>" +
                    '<p class="lesson-desc">' + p.description + "</p>";
                if (p.status === "soon") {
                    return '<li><div class="lesson-card is-soon" aria-disabled="true">' + inner +
                        '<span class="soon-tag">' + I18n.t("status.soon") + '</span></div></li>';
                }
                return '<li><a class="lesson-card" href="' + p.file + '">' + inner +
                    '<span class="lesson-go">' + I18n.t("jlpt.openPage") + '</span></a></li>';
            }
            host.innerHTML = groups.map(function (g) {
                var items = pages.filter(function (p) { return p.group === g.id; });
                if (!items.length) return "";
                return '<section class="jlpt-group" aria-labelledby="g-' + g.id + '">' +
                    '<h2 class="section-title" id="g-' + g.id + '">' + g.title + "</h2>" +
                    '<p class="group-intro">' + g.intro + "</p>" +
                    '<ul class="lesson-grid">' + items.map(card).join("") + "</ul></section>";
            }).join("");
        })();
    </script>
</body>
</html>
