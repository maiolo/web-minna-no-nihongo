<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%23B0281F%27/%3E%3Ctext x=%2750%27 y=%2772%27 font-size=%2770%27 text-anchor=%27middle%27 fill=%27white%27%3E日%3C/text%3E%3C/svg%3E">
    <title>JLPT - 日本語能力試験</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#F5F0E6">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/prefs.js"></script>
</head>
<body>

    <header id="page-header"></header>

    <main>
        <p class="page-intro"><ruby>日<rt>に</rt></ruby><ruby>本<rt>ほん</rt></ruby><ruby>語<rt>ご</rt></ruby><ruby>能<rt>のう</rt></ruby><ruby>力<rt>りょく</rt></ruby><ruby>試<rt>し</rt></ruby><ruby>験<rt>けん</rt></ruby> • Material de apoio para o Exame de Proficiência em Língua Japonesa.</p>
        <h2 class="section-title" style="margin-top: 30px;">Páginas disponíveis</h2>
        <ul class="lesson-grid" id="jlpt-list"></ul>
    </main>

    <footer>
        みんなの日本語 • versão web para estudo
    </footer>

    <script src="../assets/js/settings-panel.js"></script>
    <script src="../assets/js/site-header.js"></script>
    <script>
        SiteHeader.render(document.getElementById("page-header"), {
            stamp: "試",
            title: "JLPT",
            back: { href: "../index.html", label: "Voltar ao início" },
            crumbs: [{ label: "Início", href: "../index.html" }, { label: "JLPT" }]
        });
    </script>
    <script src="../assets/js/jlpt-index.js"></script>
    <script>
        (function () {
            var list = document.getElementById("jlpt-list");
            if (!window.JLPT_PAGES || !window.JLPT_PAGES.length) {
                list.outerHTML = '<p class="empty-state">Nenhuma página disponível ainda.</p>';
                return;
            }
            list.innerHTML = window.JLPT_PAGES.map(function (p) {
                return '<li><a class="lesson-card" href="' + p.file + '">' +
                    '<div class="lesson-number">' + p.level + "</div>" +
                    '<div class="lesson-topic">' + p.topic + "</div>" +
                    '<p class="lesson-desc">' + p.description + "</p>" +
                    '<span class="lesson-go">Abrir página →</span>' +
                "</a></li>";
            }).join("");
        })();
    </script>
</body>
</html>
